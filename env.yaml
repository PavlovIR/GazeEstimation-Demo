{
  "version": 1,
  "python": "3.11",
  "uv_sync": {
    "skip_packages": [
      "torch",
      "torchvision"
    ]
  },
  "pytorch": {
    "packages": {
      "torch": "2.11.0",
      "torchvision": "0.26.0"
    },
    "nvidia": {
      "preferred_backends": [
        {
          "min_cuda": "12.8",
          "torch_backend": "cu128"
        },
        {
          "min_cuda": "12.6",
          "torch_backend": "cu126"
        },
        {
          "min_cuda": "11.8",
          "torch_backend": "cu118"
        }
      ]
    },
    "amd": {
      "linux_backend": "rocm6.3"
    },
    "apple": {
      "torch_backend": null
    },
    "cpu": {
      "torch_backend": "cpu"
    }
  }
}
